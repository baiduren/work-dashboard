name: CI

on:
  # 只在 PR 上跑检查（分支保护要求该 status check，合并前必须通过）
  pull_request:
    branches: [main]
  # 镜像发布触发：每天 21:00（Asia/Shanghai = 13:00 UTC）、手动、推 v* tag
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    env:
      # 仅用于 prisma 生成与构建，不连接真实数据库
      DATABASE_URL: file:./dev.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: build & push image
    # PR 上只构建不推送（提前发现 Dockerfile 问题）；定时 / 手动 / v* tag 时登录并发布
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker Hub secrets
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          missing=0
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::缺少仓库 Secret DOCKERHUB_USERNAME（Docker Hub 用户名）"
            missing=1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::缺少仓库 Secret DOCKERHUB_TOKEN（Docker Hub Access Token，需 Read & Write）"
            missing=1
          fi
          exit $missing

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY || 'work-dashboard' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build only (PR validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          # 默认只构建 linux/amd64；需要 arm64 时加上 linux/arm64，并在前面添加
          # docker/setup-qemu-action@v3（构建时间会明显增加）
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
